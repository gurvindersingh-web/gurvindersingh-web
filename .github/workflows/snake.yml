name:  Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday at midnight UTC
  workflow_dispatch:        # Manual trigger from Actions tab
  push:
    branches: [main]        # Also run on every push to main

permissions:
  contents: write           # Required to push SVGs to the output branch

jobs:
  generate:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake (light + dark + Custom)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-custom.svg?color_snake=#60a5fa&color_dots=#1e293b,#334155,#475569,#3b82f6,#60a5fa

      - name: Slow down snake animation (3x slower)
        run: |
          for svg in dist/*.svg; do
            python3 -c "
          import re, sys
          f = sys.argv[1]
          with open(f) as fh:
              content = fh.read()
          def triple(m):
              val = float(m.group(1))
              return f'animation-duration:{val*3:.1f}ms'
          content = re.sub(r'animation-duration:([0-9.]+)ms', triple, content)
          with open(f, 'w') as fh:
              fh.write(content)
          " "$svg"
          done

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
