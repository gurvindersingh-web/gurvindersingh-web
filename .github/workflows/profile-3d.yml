name: 🌐 GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 */18 * * *"   # Regenerates every 18 hours
  workflow_dispatch:           # Manual trigger from Actions tab
  push:
    branches: [main]           # Also runs on push so it generates immediately

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: |
            {
              "githubUserName": "gurvindersingh-web",
              "backgroundColor": "#0d1117",
              "foregroundColor": "#bd93f9",
              "contributionColorArray": ["#282a36", "#44475a", "#6272a4", "#bd93f9", "#ff79c6"],
              "quarterPipeColor": "#282a36",
              "normalColor": "#6272a4",
              "guideColor": "#44475a"
            }

      - name: Commit & Push 3D graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push
